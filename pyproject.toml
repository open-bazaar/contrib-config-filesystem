[project]
name = "bazaar-contrib-config-filesystem"
version = "0.3.0rc9"
description = "The Bazaar Compute Node Config Filesystem Contrib"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = ["bazaar-contrib-config~=0.3.0rc1", "filelock>=3.20.0", "tomli-w>=1.2.0"]

[project.urls]
Repository = "https://github.com/open-bazaar/contrib-config-filesystem"

[project.entry-points."bazaar_compute_node.contribs"]
config-filesystem = "bazaar_contrib_config_filesystem:filesystem"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.bcn.ci]
platforms = ["linux", "windows"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:anyio"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.15"
pythonPlatform = "All"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMatchNotExhaustive = "error"
reportUnreachable = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"

[tool.ruff.lint]
extend-select = ["ASYNC"]

[dependency-groups]
dev = [
    "aiofiles>=25.1.0",
    "types-aiofiles>=25.1.0",
    "blockbuster>=1.5.29,<1.6",
    "pyright==1.1.414",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]
